name: biblical_quiz
description: "Quiz biblique — lire et comprendre la Bible (Louis Segond 1910 / King James 1769)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/bible/
    - assets/content/
    - assets/content/paths/
    - assets/branding/

flutter_launcher_icons:
  image_path: "assets/branding/icon-full.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1E3A5F"
  adaptive_icon_foreground: "assets/branding/icon-foreground.png"
